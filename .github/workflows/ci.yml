name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  validate:
    name: Code Quality & Build Verification
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: main/package.json

      - name: Install dependencies
        working-directory: main
        run: npm ci

      - name: Run ESLint
        working-directory: main
        run: npm run lint

      - name: Run TypeScript typecheck
        working-directory: main
        run: npx tsc --noEmit

      - name: Test production build
        working-directory: main
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Dependency security check
        working-directory: main
        run: npm audit --audit-level=high
        continue-on-error: true

  deploy:
    name: Production Deployment
    needs: [validate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: main/package.json

      - name: Install dependencies
        working-directory: main
        run: npm ci

      - name: Deploy to Vercel (Production)
        if: env.VERCEL_TOKEN != ''
        working-directory: main
        run: |
          npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deployment status notification
        run: echo "Quality checks and production build tests passed successfully."
